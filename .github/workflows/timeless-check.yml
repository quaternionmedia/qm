# Durable text states what is true now, not how it came to be.
#
# This corpus's own copy of project-seed/ci/timeless-check.yml. It differs
# from the seed in one way, because this is the corpus rather than a project:
# the script is at project-seed/ci/, not governance/qm/project-seed/ci/, and
# there is no submodule to check out. What the check sees and what it cannot
# is the seed file's header.

name: Timeless text

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  timeless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Added durable text states what is true now
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base="origin/${{ github.base_ref }}"
          else
            before='${{ github.event.before }}'
            if [ -n "$before" ] && [ "$before" != '0000000000000000000000000000000000000000' ] \
               && git rev-parse --verify -q "$before^{commit}" >/dev/null; then
              base="$before"
            else
              base="HEAD^"
            fi
          fi
          python project-seed/ci/check_timeless.py --base "$base"
