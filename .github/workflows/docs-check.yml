# The committed generated documents still describe the repository.
#
# The index documents are committed and regenerated by hand, so each is true
# at the commit that regenerated it and at no other: `status/documents.yaml`,
# `handbook/document-states.md` and `loose-ends.json`, with the gate document
# and its view, the site palette, the family pages and the rollout beside them.
# `uv run qm docs check` runs every generator's check mode against the tree and
# nothing else. This runs the same step on every pull request into `main` and
# on every push to it, so a page that changes state without its index is that
# pull request's red, and two pull requests each green at their own tip leave
# `main` red rather than stale.
#
# No path filter. The index documents describe every page in the repository,
# so there is no path a change can touch without possibly moving one of them.
#
# What it cannot see:
#
#   - A document with no check mode, `status/harness.yaml` and `families.json`.
#     Their freshness is the staleness budget each carries in its own
#     `reading:` block, and the step reports them skipped.
#   - The enforcement layer of `status/gates.yaml`, which is read from the host
#     and changes without a commit here.
#   - Whether a generated document is true. The step compares each document
#     with what its generator writes from this tree; a generator that is wrong
#     is wrong on both sides.

name: Generated documents

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch per workflow. A second push supersedes the first: the
# result of a run whose commit has been replaced is not read, and its minutes
# are billed.
#
# Cancellation applies to pull requests only. On the default branch the run is
# the record of what that commit reported, and cancelling it would remove the
# only evidence that the commit was checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every branch: the family site pages read which `project/<name>`
          # branches exist, and a shallow checkout holds none of them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pyyaml
        run: pip install --quiet pyyaml

      # The script, not `uv run qm docs check`. The CLI dispatches to exactly
      # this module and decides nothing itself, and a workflow that installed
      # the package to reach it would test the packaging on every pull request
      # as a side effect.
      - name: Every checkable generated document still describes the repository
        run: python ci/generate_docs.py --check
