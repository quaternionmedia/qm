name: ADR lint

# This corpus runs, against its own records, the lint it requires of every
# project.
#
# On main this lints records/ against the index in README.md. On a
# project/<name> branch it also lints that project's adr/ directory, which
# only exists on those branches. Every directory-scoped step is guarded, so a
# branch that lacks a given directory reports a logged pass rather than a
# failure -- and no step needs editing when a directory moves to its own
# branch.

on:
  push:
    branches: [main, 'project/**']
  pull_request:

# One run per branch per workflow. A second push supersedes the first: the
# result of a run whose commit has been replaced is not read, and its minutes
# are billed.
#
# Cancellation applies to pull requests only. On the default branch and on a
# project branch the run is the record of what that commit reported, and
# cancelling it would remove the only evidence that the commit was checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  adr-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            # On a push, diff the whole pushed range. HEAD^ would cover only the
            # last commit, so an edit to a ratified body earlier in the same
            # push would pass unseen. github.event.before is all zeros for a
            # newly created ref, which has no range to compare against.
            before='${{ github.event.before }}'
            if [ -n "$before" ] && [ "$before" != '0000000000000000000000000000000000000000' ]                && git rev-parse --verify -q "$before^{commit}" >/dev/null; then
              echo "ref=$before" >> "$GITHUB_OUTPUT"
            elif git rev-parse --verify -q HEAD^ >/dev/null; then
              echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
            else
              echo "ref=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Lint org records
        run: |
          python project-seed/ci/adr_lint.py \
            --records-dir records \
            --index README.md \
            ${{ steps.base.outputs.ref && format('--base-ref {0}', steps.base.outputs.ref) }}

      # A top-level adr/ belongs to exactly one project and lives on that
      # project's own branch. On the default branch it is a namespace violation
      # that the lint step cannot see: that step guards on the directory
      # existing, so a stray adr/ would be linted and pass.
      #
      # It arrives by a pull request from project/<name> into main.
      # check_pr_base.py refuses that pull request; this step is the second line,
      # and turns the default branch red if one lands.
      - name: The default branch carries no project records
        run: |
          if [ "$GITHUB_REF_NAME" = "${DEFAULT_BRANCH}" ] && [ -d adr ]; then
            echo "::error::adr/ exists on ${DEFAULT_BRANCH}. A top-level adr/ holds one"
            echo "::error::project's records and belongs on that project's own"
            echo "::error::project/<name> branch. On the default branch it is in the org"
            echo "::error::namespace, where a project-local decision reads as binding"
            echo "::error::every project. See docs/ref/namespaces.md."
            exit 1
          fi
          echo "ok - no top-level adr/ on the default branch, or this is not it."
        env:
          # A literal, not ${{ github.event.repository.default_branch }}. That
          # field is absent from a `push` payload and from every local run, where
          # it resolves to the empty string and the comparison never matches.
          DEFAULT_BRANCH: main

      # Tool involvement is disclosed in a `Tools:` note and nowhere else, so a
      # vendor or model name is refused in a commit subject and in a record's
      # prose as well as in a trailer. A paragraph naming three or more competing
      # vendors is exempt: that is an interoperability claim, not a byline.
      - name: No vendor or model name outside a Tools note
        run: |
          python project-seed/ci/check_attribution.py             --records-dir records             ${{ steps.base.outputs.ref && format('--base-ref {0}', steps.base.outputs.ref) }}

      # A record whose summary lives in an entry point declares where, and the
      # entry point names the record back. records/DRAFT-the-read-document-governs.md
      # §6. This pairs declarations; it cannot tell that a summary and its record
      # disagree, and it cannot find a restatement nobody declared. The tool
      # prints both limits on every run.
      - name: Every declared restatement names its record, and the reverse
        run: python ci/check_restatements.py

      # One layer up from `check_restatements.py`, which pairs a record with the
      # documents that summarise it: this pairs a principle with the principles
      # it names. It never requires an edge, because an unforced graph is the
      # point; it requires a declaration, and `none` with a reason is a
      # first-class answer.
      - name: Every principle declares its edges, or declares it has none
        run: python ci/check_principle_edges.py

      # A seed carries placeholders on purpose; a copy that keeps one is a
      # template being shown to its reader. Guarded on the directory existing, so
      # it is a logged skip on main and a real check on a project/<name> branch --
      # which is the only place an adr/ copy exists.
      - name: No copy shows a template to its reader
        run: |
          if [ -d adr ]; then
            python project-seed/ci/check_placeholders.py               --seed project-seed/adr --copy adr
          else
            echo 'No adr/ on this branch; no copy to check.'
          fi

      - name: Lint this branch's project records
        run: |
          if [ -d adr ]; then
            python project-seed/ci/adr_lint.py \
              --records-dir adr \
              --index adr/README.md \
              ${{ steps.base.outputs.ref && format('--base-ref {0}', steps.base.outputs.ref) }}
          else
            echo 'No adr/ on this branch; nothing to lint.'
          fi
