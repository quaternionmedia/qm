name: ADR lint

# This corpus runs the lint it requires of every project, against its own
# records. A repository whose entire subject is decision-record discipline is
# the last one that should rely on an unchecked convention.
#
# On main this lints records/ against the index in README.md. On a
# project/<name> branch it also lints that project's adr/ directory, which
# only exists on those branches. Every directory-scoped step is guarded, so a
# branch that lacks a given directory reports a logged pass rather than a
# failure -- and no step needs editing when a directory moves to its own
# branch.

on:
  push:
    branches: [main, 'project/**']
  pull_request:

# One run per branch per workflow. A second push supersedes the first: nobody
# reads the result of a run whose commit has already been replaced, and the
# minutes are real -- 55 of this repository's 129 runs on 2026-08-11 came from
# five iterative pushes to two pull request branches, where only the last
# mattered.
#
# Cancellation is scoped to pull requests deliberately. On the default branch
# and on a project branch the run IS the record of what that commit reported,
# and cancelling it to start a newer one destroys the only evidence that the
# earlier commit was ever checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  adr-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            # On a push, diff the whole pushed range. HEAD^ would cover only the
            # last commit, so an edit to a ratified body earlier in the same
            # push would pass unseen. github.event.before is all zeros for a
            # newly created ref, which has no range to compare against.
            before='${{ github.event.before }}'
            if [ -n "$before" ] && [ "$before" != '0000000000000000000000000000000000000000' ]                && git rev-parse --verify -q "$before^{commit}" >/dev/null; then
              echo "ref=$before" >> "$GITHUB_OUTPUT"
            elif git rev-parse --verify -q HEAD^ >/dev/null; then
              echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
            else
              echo "ref=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Lint org records
        run: |
          python project-seed/ci/adr_lint.py \
            --records-dir records \
            --index README.md \
            ${{ steps.base.outputs.ref && format('--base-ref {0}', steps.base.outputs.ref) }}

      # There was a step here linting `streaming-infrastructure/adr/`. It is gone:
      # no branch in this repository has that path -- those records are at `adr/`
      # on `project/streaming-infrastructure`, which the generic step below
      # already lints -- so the condition was unreachable on every ref CI runs
      # against, and the step could only ever print its reassuring else-branch.
      # A check that cannot fire is worse than none, because the log says it ran.

      # A top-level adr/ belongs to exactly one project and lives on that
      # project's own branch. On the default branch it is a namespace violation,
      # and the step below would not catch it -- it guards on the directory
      # existing, so a stray adr/ would simply be linted and pass, and a clean
      # lint is the most reassuring possible report about records that are in the
      # wrong namespace entirely.
      #
      # The way it gets there is a pull request from project/<name> into main.
      # check_pr_base.py refuses that, and this is the second line: if one ever
      # lands, the default branch goes red instead of green.
      - name: The default branch carries no project records
        run: |
          if [ "$GITHUB_REF_NAME" = "${DEFAULT_BRANCH}" ] && [ -d adr ]; then
            echo "::error::adr/ exists on ${DEFAULT_BRANCH}. A top-level adr/ holds one"
            echo "::error::project's records and belongs on that project's own"
            echo "::error::project/<name> branch. On the default branch it is in the org"
            echo "::error::namespace, where a project-local decision reads as binding"
            echo "::error::every project. See docs/ref/namespaces.md."
            exit 1
          fi
          echo "ok - no top-level adr/ on the default branch, or this is not it."
        env:
          # A literal, not ${{ github.event.repository.default_branch }}. That
          # field is absent from a `push` payload and from every local run, so it
          # resolved to the empty string, the comparison never matched, and the
          # step reported ok with a stray adr/ sitting right there. A guard whose
          # condition cannot be reached is worse than no guard: it reports the
          # reassuring answer and nobody looks again.
          DEFAULT_BRANCH: main

      # Tool involvement is disclosed in a `Tools:` note and nowhere else. The
      # co-author trailer was already forbidden; a commit subject and a record's
      # prose were not, so "Re-refactor docs with <model>" passed every gate this
      # org had. A paragraph naming three or more competing vendors is exempt --
      # that is an interoperability claim, not a byline, and this corpus needs to
      # be able to make one.
      - name: No vendor or model name outside a Tools note
        run: |
          python project-seed/ci/check_attribution.py             --records-dir records             ${{ steps.base.outputs.ref && format('--base-ref {0}', steps.base.outputs.ref) }}

      - name: Lint this branch's project records
        run: |
          if [ -d adr ]; then
            python project-seed/ci/adr_lint.py \
              --records-dir adr \
              --index adr/README.md \
              ${{ steps.base.outputs.ref && format('--base-ref {0}', steps.base.outputs.ref) }}
          else
            echo 'No adr/ on this branch; nothing to lint.'
          fi
