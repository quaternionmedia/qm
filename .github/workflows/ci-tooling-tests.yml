name: CI tooling tests

# The checks in project-seed/ci/ are copied, by reference, into every adopting
# project. Until now nothing tested them, and six defects reached the seed --
# each one a check that reported success while enforcing nothing, which is the
# only failure mode that matters for a check.
#
# These tests build real git repositories rather than mocking git. The tools
# are almost entirely about git, and a mock would encode the same
# misunderstanding the tool does and then agree with it.

on:
  push:
    branches: [main]
    paths:
      - 'project-seed/ci/**'
      - 'ci/**'
      - '.github/workflows/ci-tooling-tests.yml'
  pull_request:
    paths:
      - 'project-seed/ci/**'
      - 'ci/**'
      - '.github/workflows/ci-tooling-tests.yml'

# One run per branch per workflow. A second push supersedes the first: nobody
# reads the result of a run whose commit has already been replaced, and the
# minutes are real -- 55 of this repository's 129 runs on 2026-08-11 came from
# five iterative pushes to two pull request branches, where only the last
# mattered.
#
# Cancellation is scoped to pull requests deliberately. On the default branch
# and on a project branch the run IS the record of what that commit reported,
# and cancelling it to start a newer one destroys the only evidence that the
# earlier commit was ever checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest and pyyaml
        run: python -m pip install --quiet pytest pyyaml

      - name: Run the CI tooling tests
        # Both suites: project-seed/ci/tests covers the checks every project
        # copies, ci/tests covers the org-level governance tooling. They are
        # separate directories because the code is -- one is copy-forward and
        # one is a singleton for this repository -- and a single command keeps
        # them from drifting into separate jobs nobody keeps in step.
        #
        # The fixtures create submodules from local paths, which git refuses by
        # default since CVE-2022-39253. The repositories are built in the
        # runner's own temp directory moments earlier, so the protection is not
        # doing anything here except preventing the test from running.
        run: python -m pytest project-seed/ci/tests ci/tests walkthrough -q --doctest-glob=*.md

      # The cookbook pages are executable, and this names their directory
      # explicitly. It must: pytest ignores `testpaths` the moment it is given a
      # path argument, and the step above gives it two -- so a `testpaths`-wired
      # walkthrough would be collected by nobody and stay green forever.
      # Verified: with `testpaths = ["walkthrough"]` set, a bare `pytest
      # --collect-only` collects the pages and `pytest tests --collect-only`
      # collects zero of them.
      #
      # Separate step rather than more paths on the line above, so a failure
      # names which half broke.
      - name: Run the executable cookbook pages
        run: python -m pytest --doctest-glob='*.md' docs/cookbook -q
        env:
          GIT_ALLOW_PROTOCOL: file:https:ssh
