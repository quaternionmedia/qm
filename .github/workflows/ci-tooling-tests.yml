name: CI tooling tests

# The checks in project-seed/ci/ are copied, by reference, into every adopting
# project, and these tests exercise them here first. The failure they look for
# is a check that reports success while enforcing nothing.
#
# These tests build real git repositories rather than mocking git. The tools
# are almost entirely about git, and a mock would encode the same
# misunderstanding the tool does and then agree with it.

on:
  push:
    branches: [main]
    paths:
      - 'project-seed/ci/**'
      - 'ci/**'
      - '.github/workflows/ci-tooling-tests.yml'
  pull_request:
    paths:
      - 'project-seed/ci/**'
      - 'ci/**'
      - '.github/workflows/ci-tooling-tests.yml'

# One run per branch per workflow. A second push supersedes the first: the
# result of a run whose commit has been replaced is not read, and its minutes
# are billed.
#
# Cancellation applies to pull requests only. On the default branch and on a
# project branch the run is the record of what that commit reported, and
# cancelling it would remove the only evidence that the commit was checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest and pyyaml
        run: python -m pip install --quiet pytest pytest-xdist pyyaml

      - name: Run the CI tooling tests
        # Both suites: project-seed/ci/tests covers the checks every project
        # copies, ci/tests covers the org-level governance tooling. They are
        # separate directories because the code is -- one is copy-forward and
        # one is a singleton for this repository -- and a single command keeps
        # them from drifting into separate jobs nobody keeps in step.
        #
        # The fixtures create submodules from local paths, which git refuses by
        # default since CVE-2022-39253. The repositories are built in the
        # runner's own temp directory by the test itself, so the protection
        # guards nothing here and is turned off for this step.
        run: python -m pytest project-seed/ci/tests ci/tests walkthrough -q --doctest-glob=*.md -n auto

      # The cookbook pages are executable, and this names their directory
      # explicitly. pytest ignores `testpaths` once it is given a path argument,
      # and the step above gives it two, so a walkthrough wired only through
      # `testpaths` would not be collected: with `testpaths = ["walkthrough"]`
      # set, a bare `pytest --collect-only` collects the pages and
      # `pytest tests --collect-only` collects none of them.
      #
      # Separate step rather than more paths on the line above, so a failure
      # names which half broke.
      - name: Run the executable usage pages
        run: python -m pytest --doctest-glob='*.md' docs/usage -q
        env:
          GIT_ALLOW_PROTOCOL: file:https:ssh
