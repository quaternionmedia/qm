name: One PR per contributor

# This corpus's own copy of project-seed/ci/one-pr-check.yml. It differs from
# the seed in exactly two ways, and both are consequences of this being the
# corpus rather than a project:
#
#   1. The script is at project-seed/ci/, not governance/qm/project-seed/ci/ --
#      there is no submodule here to run it out of.
#
#   2. `--per-base 'project/*'` is passed. Every project/<name> branch here is
#      an adopting project's own adr/ directory, pinned by that project's
#      submodule. A propagation pull request into project/alfred and one into
#      project/datum are two unrelated projects; combining them to satisfy a
#      slot count would invent a dependency between them and hand the reviewer
#      a worse artifact than the two it replaced.
#
#      This is the only known instance of that shape, and it is an exemption
#      rather than a different rule: `main` still holds exactly one slot per
#      contributor, and two pull requests against the *same* project branch
#      still fail. The flag is printed in the tool's own output, because an
#      exemption nobody can see in the result has stopped being one.
#
# See handbook/async-contract.md §1.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# One run per branch per workflow. A second push supersedes the first: nobody
# reads the result of a run whose commit has already been replaced, and the
# minutes are real -- 55 of this repository's 129 runs on 2026-08-11 came from
# five iterative pushes to two pull request branches, where only the last
# mattered.
#
# Cancellation is scoped to pull requests deliberately. On the default branch
# and on a project branch the run IS the record of what that commit reported,
# and cancelling it to start a newer one destroys the only evidence that the
# earlier commit was ever checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  slot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: This contributor holds at most one open pull request here
        run: |
          python project-seed/ci/check_one_pr.py \
            --repo "$GITHUB_REPOSITORY" \
            --contributor "$PR_AUTHOR" \
            --per-base 'project/*'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
