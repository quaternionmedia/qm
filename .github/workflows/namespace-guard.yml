name: Namespace guard

# The branch-per-project model gives each adopting project a project/<name>
# branch of this repo carrying exactly one thing: that project's own adr/
# directory. Everything else on the branch is org content that arrives by
# merging main, and is not the project's to edit.
#
# GitHub rulesets cannot express this. Their file-path restriction is a push
# ruleset that applies repository-wide with no branch targeting, so the check
# has to live here.
#
# It compares content, not commits: a path is flagged only when it differs
# from main's version, meaning this branch and nothing else put it there. Propagation flows one way,
# from main outwards, so org-namespace content added on a project branch never
# reaches main and is stranded where nobody looks for it.

# Both events, deliberately. The pull_request trigger is the gate; the push
# trigger exists because a project branch is one of the two places in this
# corpus where content legitimately arrives by push -- the initial `adr/` when
# the branch is created (see the README's "Branch namespaces"). A push is
# therefore not refusable, but it is the one route by which org content can land
# on a project branch with nothing having looked at it, and this check is the
# only thing that looks. Reporting after the fact beats not reporting.
on:
  pull_request:
    branches: ['project/**']
  push:
    branches: ['project/**']

# One run per branch per workflow. A second push supersedes the first: nobody
# reads the result of a run whose commit has already been replaced, and the
# minutes are real -- 55 of this repository's 129 runs on 2026-08-11 came from
# five iterative pushes to two pull request branches, where only the last
# mattered.
#
# Cancellation is scoped to pull requests deliberately. On the default branch
# and on a project branch the run IS the record of what that commit reported,
# and cancelling it to start a newer one destroys the only evidence that the
# earlier commit was ever checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  namespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A project branch's own commits touch adr/ only
        run: |
          # `github.base_ref` is set on a pull_request and EMPTY on a push, so
          # taking it unconditionally would make `base` the ref `origin/` and
          # fail the step on every push -- a false red introduced by adding the
          # trigger. On a push the branch's own base is the default branch.
          base_ref="${{ github.base_ref }}"
          base_ref="${base_ref:-main}"
          base="origin/${base_ref}"
          git fetch --no-tags origin "$base_ref" main

          # Compare against the merge base so org content arriving by a merge
          # from main is not mistaken for the project editing it.
          mergebase=$(git merge-base "$base" HEAD)
          candidates=$(git diff --name-only "$mergebase" HEAD -- . ':(exclude)adr/**')

          # Then keep only paths whose content actually differs from main's.
          # A propagation PR carries main's non-adr/ changes by definition --
          # that is what propagation IS -- so comparing commits rather than
          # content fails every one of them, which is how this check first
          # broke #18, #19 and #20.
          offending=$(
            for f in $candidates; do
              git diff --quiet origin/main HEAD -- "$f" || echo "$f"
            done
          )

          if [ -n "$offending" ]; then
            echo "A project/* branch may only add or change files under adr/."
            echo
            echo "These paths are outside it:"
            echo "$offending" | sed 's/^/  /'
            echo
            echo "Org-level content belongs on main and reaches this branch by"
            echo "merging main. Added here it is stranded: propagation is one-"
            echo "directional, so nothing carries it back."
            exit 1
          fi

          echo "Clean: this branch's own commits touch adr/ only."
