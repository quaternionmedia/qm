name: Governance status

# The committed status/governance.yaml is a rendering of specific commits. This
# job asks the question CI can answer about it: given the commits the document
# names, are the numbers in it right?
#
# It does not regenerate and compare. The document's github layer reads other
# repositories, so a pull request opened in one of them would make this
# repository's committed copy differ with no commit here to explain it, and an
# unrelated pull request here would go red for a reason its author cannot fix.
# `behind_corpus` also changes on every merge to main, so a byte comparison
# against a fresh generation could not be made to pass.
#
# No network, no credential, no `gh`: the check runs identically in a fork pull
# request and in a scheduled run. Refreshing the document is a human action --
# see handbook/handoffs/governance-status-generator.md.

on:
  push:
    branches: [main]
    paths:
      - 'status/governance.yaml'
      - 'ci/**'
      - '.github/workflows/governance-status.yml'
  pull_request:
    paths:
      - 'status/governance.yaml'
      - 'ci/**'
      - '.github/workflows/governance-status.yml'

# One run per branch per workflow. A second push supersedes the first: the
# result of a run whose commit has been replaced is not read, and its minutes
# are billed.
#
# Cancellation applies to pull requests only. On the default branch and on a
# project branch the run is the record of what that commit reported, and
# cancelling it would remove the only evidence that the commit was checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyyaml
        run: python -m pip install --quiet pyyaml

      - name: Fetch the refs the document describes
        # actions/checkout fetches the checked-out ref and nothing else, so
        # refs/remotes/origin/project/* does not exist in a runner by default.
        # Without this the check finds no project branches. It refuses to pass
        # in that state rather than reporting clean, and fetching is the fix.
        run: |
          git fetch --no-tags --quiet origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/project/*:refs/remotes/origin/project/*'
          git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/project/*'

      - name: The document faithfully renders the commits it names
        run: python ci/governance_status.py --check status/governance.yaml

      - name: It also renders
        # The document must also render. The renderer touches no network.
        run: |
          python ci/governance_render.py status/governance.yaml --out /tmp/governance-status.html
          test -s /tmp/governance-status.html
