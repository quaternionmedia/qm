name: Symlink integrity

# records/DRAFT-ide-integrated-governance-discovery.md §4 makes this repo's
# .vscode/ and .claude/ configuration pointers real git symlinks (mode 120000)
# to their canonical file in project-seed/ide/ and adapters/, so there is no
# second copy to keep in sync. That is the whole mechanism behind
# handbook/async-contract.md's "down" direction: an edit to the seed is an
# edit to this repository's own harness, in the same commit.
#
# The failure mode this guards is silent and platform-specific: a Windows
# contributor without `git config core.symlinks true` checks these out as
# one-line text files containing the target path. Editing and committing one
# converts the symlink to a regular file. Nothing else in CI would notice, and
# the pointer would then hold a stale copy of content it is supposed to
# resolve to.
#
# What it cannot see: the instruction pointers. CLAUDE.md and
# project-seed/ide/CLAUDE.md are regular files holding the one line
# `@AGENTS.md`, an import the tool that reads them expands (the record's §2),
# and a wrong line in either is a text change this step does not read. The two
# AGENTS.md files are genuinely different documents, not linked to each other,
# so a rule missing from one is outside it too.
#
# Mutation (AGENTS.md item 13): with CLAUDE.md added to the expected list
# below, the step names it as not a symlink, with mode 100644, and exits 1;
# with the list as committed it reports ok for every path and exits 0.

on:
  push:
    branches: [main, 'project/**']
  pull_request:

# One run per branch per workflow. A second push supersedes the first: the
# result of a run whose commit has been replaced is not read, and its minutes
# are billed.
#
# Cancellation applies to pull requests only. On the default branch and on a
# project branch the run is the record of what that commit reported, and
# cancelling it would remove the only evidence that the commit was checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  symlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every pointer file is still mode 120000
        run: |
          expected=".vscode/settings.json
          .vscode/extensions.json
          .claude/commands/cowork.md
          .claude/commands/preflight.md
          .claude/commands/handoff.md
          .claude/commands/status.md
          .claude/skills/design-review"

          status=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mode=$(git ls-files -s -- "$path" | awk '{print $1}')
            if [ -z "$mode" ]; then
              echo "MISSING  $path is not tracked"
              status=1
            elif [ "$mode" != "120000" ]; then
              echo "NOT A SYMLINK  $path has mode $mode, expected 120000"
              echo "               A checkout without core.symlinks turns these into text"
              echo "               files; committing one replaces the pointer with a copy."
              status=1
            else
              echo "ok  $path -> $(git cat-file -p "$(git ls-files -s -- "$path" | awk '{print $2}')")"
            fi
          done <<< "$expected"

          exit $status
