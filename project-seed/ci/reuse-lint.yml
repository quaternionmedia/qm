name: REUSE lint

# SEED FILE: copy verbatim into a forking project's .github/workflows/.
#
# The outbound-licensing record's enforcement clause. Checks that every file
# carries copyright and licence information, that every licence referenced has
# its text in LICENSES/, and that no licence text sits there unused.
#
# Self-contained, like submodule-check.yml and unlike adr-lint.yml: `reuse` is
# a published tool, so there is nothing project-specific to run from the
# governance submodule.
#
# Deliberately runtime-shape independent. It works identically for a corpus of
# prose, a Python service, a single-file HTML deliverable and a hardware
# repository -- which is what the open-license record's SBOM path cannot do,
# and the gap the qmetronome onramp retrospective named.
#
# Start in reporting mode. A repository that has not had its licensing pass
# will fail this immediately and usefully; make it blocking once it is green,
# and say in the project's adoption record which date that happened.
# To report without blocking, add:  continue-on-error: true  to the lint step.

on:
  push:
    branches: [main]
  pull_request:

# One run per branch per workflow. A second push supersedes the first: nobody
# reads the result of a run whose commit has already been replaced, and the
# minutes are real -- 55 of this repository's 129 runs on 2026-08-11 came from
# five iterative pushes to two pull request branches, where only the last
# mattered.
#
# Cancellation is scoped to pull requests deliberately. On the default branch
# and on a project branch the run IS the record of what that commit reported,
# and cancelling it to start a newer one destroys the only evidence that the
# earlier commit was ever checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: reuse lint
        # Run through uv's tool runner rather than installed with pip. The tool
        # gets an environment of its own, so the step writes into no
        # interpreter it did not make and does not depend on pip being present
        # in whichever python is first on PATH -- a uv-made virtual environment
        # has none, which made this step fail under the local workflow runner
        # in every uv-managed checkout while the hosted run passed.
        #
        # The charset-normalizer extra, not bare `reuse`: without it the
        # package needs libmagic at import time and dies with
        # NoEncodingModuleError before it lints anything. The runner image has
        # libmagic; a Windows box does not.
        run: uvx 'reuse[charset-normalizer]' lint
