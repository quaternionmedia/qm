  - id: 2026-08-16-003
    tool: assistant-2026-08
    kind: fix
    action: >
      Redact the org inventory: assistant-2026-08 wrote 34 private repository
      names and 28 paths containing the reviewer's username into the working
      tree of a public repository
    projected_impact: >
      The reviewer asked whether personal details had been pushed. Expect the
      answer to be no, and expect a small fix.
    outcome: >
      Nothing was pushed. The reviewer stopped the command that would have
      pushed it, then asked the question that established what had been written.
      assistant-2026-08 wrote 34 private repository names, several of them
      people's names, and 28 absolute paths containing the reviewer's username,
      into the working tree of a repository that is public. It also contradicted
      two decisions the corpus had already written down: governance-status.yaml
      records private_repository_names_listed false, and make_workspace.py
      states it writes no absolute paths. assistant-2026-08 consulted neither
      before generating a second inventory, and so reintroduced a problem the
      corpus had already solved.
    failure_cost: >
      Nothing left the machine, because the reviewer caught it. Had the reviewer
      not stopped that command, assistant-2026-08 would have published the
      private repository names of a private organisation, irreversibly. The
      remediation: private repositories are counted and referenced by a stable
      creation-ordered id, the name mapping is machine-scoped and gitignored,
      and 16 tests fail if any of that is weakened.
    outcome_matched_projection: false
    lessons:
      - "Read how an existing generator solved a problem before generating a rival"
      - "Redaction that drops the subject is not redaction; count it and reference it"
      - "A privacy failure is silent and one-way; it needs tests, not care"
      - "Name the actor in the failure sentence -- an artifact cannot carry anything anywhere"
    tests_generated:
      - ci/tests/test_inventory.py
    status: closed

  - id: 2026-08-16-004
    tool: assistant-2026-08
    kind: build
    action: "Make tool attribution auditable on every ledger entry, not only the failures"
    projected_impact: >
