      where it is disclosed, plus `human` so an entry produced without a tool
      has something true to name. `tool` is required on all 17 entries and
      ledger.py --check refuses one that does not resolve. 13 tests.
    failure_cost: >
      None. This came from the reviewer noticing that the first two drafts of
      the entry above claimed credit readily and shed fault through an
      inanimate subject and an agentless passive.
    outcome_matched_projection: true
    lessons:
      - "A register that names an instrument only in failure lets it bank credit and shed fault"
      - "An attribution that resolves to nothing cannot be audited"
    tests_generated:
      - ci/tests/test_ledger.py
    status: closed
