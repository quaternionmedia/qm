    failure_cost: >
      Three cycles. One misdiagnosis -- the local runner was called silent when
      it had refused an unresolvable expression on stderr, which the grep was
      not reading. One more heredoc backslash failure, the seventh.
    outcome_matched_projection: true
    lessons:
      - "A check that needs key material cannot run where the key is not"
      - "Read stderr before calling a tool silent"
      - "Stop using shell heredocs for anything containing a backslash"
    tests_generated: []
