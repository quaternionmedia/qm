  - id: 2026-08-15-006
    tool: assistant-2026-08
    kind: fix
    action: "Loop pass 1: run every gate locally and remotely, and act on what differs"
    projected_impact: >
      Expect local to be green and remote to disagree somewhere, on the evidence
      of the CLI defect that only the runner found.
    outcome: >
      Local: 9 of 9 green. Remote: signatures FAILED. The cause was a design
      error, not a bug -- verifying a signature needs the signer's key and a
      runner has none, so `git log --format=%G?` on CI reports the runner's
