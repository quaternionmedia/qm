    outcome_matched_projection: true
    lessons:
      - "The reassuring default leaks into the tool written to prevent it"
    status: closed

  - id: 2026-08-15-003
    kind: fix
    action: >
      Repair the four defects the self-audit found: a comment contradicting its
      code, a perspective claim the tool no longer satisfies, an unstamped
      figure set, and no mutation pass on either new gate
    projected_impact: >
      Three prose corrections and two mutation harnesses. Expect the mutation
      pass to report at least one false green, on the evidence of the three
      earlier harnesses, which reported five between them.
    outcome: >
      Four corrections, not three -- re-reading the perspective found a second
      stale claim of the same class as the first. 10 mutations, all caught. The
      two that reported false were both harness errors: one anchor written
      against a superseded version of the function, and one aimed at a sibling
      test that iterates SUITES and therefore cannot see a dropped entry.
    failure_cost: >
      One cycle diagnosing two false negatives that were mine. Nothing in either
      tool was wrong.
    outcome_matched_projection: true
    lessons:
      - "A false green in a mutation harness is more often the harness than the test"
      - "Aim a mutation at the test that can see it, not the one whose name matches"
    tests_generated:
      - "scratchpad/mutate_signatures.py (10 mutations, both new gates)"
    status: closed

  - id: 2026-08-15-004
    kind: build
    action: "Adopt the ledger and write the glossary"
    projected_impact: >
      Make a prediction durable so an overclaim is mechanical to spot. Expect
      the ledger's own first --check run to fail, because this file is being
      written by the failure mode it exists to catch.
    outcome: >
      The check passed on the first run. The prediction was wrong, and wrong in
      the flattering direction -- it predicted a self-caught failure, which
      would have read as the instrument working. What it actually demonstrates
      is that --check verifies structure and cannot see whether a projection was
      written before the act, which is exactly the limit the record states.
    failure_cost: "none"
    outcome_matched_projection: false
    lessons:
      - "A prediction of self-caught failure is still a flattering prediction"
    tests_generated:
      - "ci/ledger.py --check"
    status: closed

  - id: 2026-08-15-005
    kind: document
    action: "Categorize the pressures shaping this assistant's output"
    projected_impact: >
      Eight categories, each tied to a count from this session rather than to
      speculation about intent. Expect the writing of it to be an instance of at
      least one category it names.
    outcome: >
      It was. Item 3 -- the shell-heredoc prior beating the harness's own file
      tool -- recurred twice more while the document naming it was being
      written, taking the count from four to six. Item 6 also recurred: a
      perspective was indexed before it existed, and the tool built to catch
      index drift read the index in one direction only.
    failure_cost: >
      Two cycles. One dangling index row committed and then repaired, and one
      check shipped with half its coverage.
    outcome_matched_projection: true
    lessons:
      - "Documenting a failure mode does not suspend it for the duration"
      - "A checker that reads an index needs both directions, every time"
    tests_generated:
      - "ci/tests/test_doc_tooling.py::test_an_index_row_naming_a_missing_file_is_reported"
    status: closed

  - id: 2026-08-15-006
    kind: fix
    action: "Loop pass 1: run every gate locally and remotely, and act on what differs"
    projected_impact: >
      Expect local to be green and remote to disagree somewhere, on the evidence
      of the CLI defect that only the runner found.
    outcome: >
      Local: 9 of 9 green. Remote: signatures FAILED. The cause was a design
      error, not a bug -- verifying a signature needs the signer's key and a
      runner has none, so `git log --format=%G?` on CI reports the runner's
      empty keyring rather than the commit. The forge already verifies
      server-side; the check now reads it with --source host in CI and --source
      git locally. Both agree: 9 debt, same commits.
    failure_cost: >
      Three cycles. One misdiagnosis -- the local runner was called silent when
      it had refused an unresolvable expression on stderr, which the grep was
      not reading. One more heredoc backslash failure, the seventh.
    outcome_matched_projection: true
    lessons:
      - "A check that needs key material cannot run where the key is not"
      - "Read stderr before calling a tool silent"
      - "Stop using shell heredocs for anything containing a backslash"
    tests_generated: []
    status: closed

  - id: 2026-08-15-007
    kind: verify
    action: "Loop passes 2-4: sweep every gate and every mutation harness until nothing new appears"
    projected_impact: >
      Expect at least one more finding. Every previous sweep this session found
      something, and the mutation harnesses have never all run clean together.
    outcome: >
      Pass 2 clean locally, remote CLEAN on all 8 checks. Pass 3 found one
      thing: mutate_cowork reported an inert test on every run, for a filter
      already documented as defence with no test naming it. The no-op mutation
      was removed. Pass 4 clean across 11 checks and 4 harnesses, 0 findings.
    failure_cost: >
      None to the corpus. The stale mutation had been reporting a false alarm on
      every run since it was written, which is the shape that teaches a reader
      to skip the output.
    outcome_matched_projection: true
    lessons:
      - "A harness that always reports one known failure trains the reader to ignore it"
    tests_generated: []
    status: closed
