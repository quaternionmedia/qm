  - id: 2026-08-16-007
    tool: assistant-2026-08
    kind: build
    action: Make base stability measurable, and build a local dev-environment report
    projected_impact: |-
      Written before acting, unlike 2026-08-16-006.

      (1) The criterion cannot be read today, and the reason is structural
      rather than an oversight. The ledger records additions. A pass that adds
      nothing leaves no trace, so "no new entries" and "nobody ran it" are the
      same file. Predict that once passes are recorded the first streak is 0 or
      1, and that the pressure will be to define a pass loosely enough to make
      the streak longer. A pass that records only the runs that went well is a
      streak counter, not a stability test.

      (2) It will be defective on its first run. Seven of eight new tools this
      session were. The likeliest defect is reading a field name that does not
      exist in a document -- inventory-public.json and ci/workspace.yaml use
      different words for the same repository, and nothing forces them to agree.

      (3) The specific risk here is privacy, and it has already happened once
      in this exact place. A tool that reads the inventory and prints
      repositories is the tool that wrote 34 private names into a committable
      artifact on 2026-08-16-003. Predict the first draft prints a name where it
      should print a reference, and that the test which should catch it passes
      anyway, because that is what happened last time: three assertions were
      inert because serialisation escaped the paths they searched for.

      (4) The recommendations will drift toward flattering the current state. A
      report whose author also wrote what it measures has every incentive to
      grade generously, and there is no detector for that. Expect the first
      draft to report the org checkout as healthier than 28 of 110 warrants.
    outcome: |-
      Built: the stability criterion as a record, `qm ledger --pass` and `--stability`,
      `qm devloop`, `qm private-names`, `qm lanes`, `ci/roster.py`, and the roster
      redaction. 743 tests pass, up from 664.

      (1) MATCHED. The criterion could not be read, and the first attempt to record a
      pass proved the point in the way predicted: it reported the FIRST pass as
      "0 added" and handed the streak a point for free. There is no previous pass to
      differ from, so the honest value is unknown. Fixed, and `--check` now refuses a
      first pass that reports a count and a later pass that claims to be a baseline.
      The streak is 0.

      (2) MATCHED, exactly as written -- "reading a field name that does not exist in
      a document". Private entries in inventory-public.json carry `ref` and `label`
      and no `name` at all, while public ones carry `name`, in the same file. Then the
      same split, once the roster was redacted, raised KeyError in a generator and
      would have raised it in three more. One shared loader now guarantees `name`,
      falling back to the ref.

      (3) MATCHED, and worse than predicted. The privacy risk was real, but not in the
      new tool: `ci/workspace.yaml` was already committed to a public repository
      naming two repositories the host reports as private, and the inventory redacted
      those same two as private-32 and private-33. The corpus contradicted itself, in
      two committed files, and nothing read both. Found by building the tool rather
      than by the tool -- the report's own output made the disagreement visible.
      Eleven further occurrences across six files, two of them generated documents
      whose fix is a lane of its own and is declared rather than half-done.

      (4) MISSED, in the direction that matters. The recommendations did not flatter:
      the report opens with "the last pass added an entry, so the base moved under
      it", and the org checkout initially UNDER-reported, calling two repositories
      absent that it structurally could not detect. That was a false claim in the
      honest direction and was fixed the same way a flattering one would have been.

      (5) UNPREDICTED, and the largest finding: a public repository has published two
      private repository names since 2b50bd6, and no forward fix removes them from
      history. Declared as an exemption with a removal condition, because a rewrite is
      forbidden here and the decision is a human's.
    failure_cost: |-
      No cycle lost to a defect this time; the projection was written first and every predicted failure was looked for rather than stumbled into. The cost is carried elsewhere: two private repository names are published in the history of a public repository and cannot be withdrawn, and eleven occurrences remain in six tracked files, two of which are generated documents whose fix was declared rather than attempted.
    outcome_matched_projection: false
    status: closed
  - id: 2026-08-16-008
    tool: assistant-2026-08
    kind: fix
    action: Withdraw a restatement this corpus declared and did not have
    found_by: the loop pass recorded at 2026-08-16, before this entry existed
    projected_impact: |-
      Not pre-written. This is a finding of a pass rather than an action taken
      on purpose, which is the case the projection rule has no answer for: a
      prediction about work nobody had decided to do.

      The pass's own expectation stands in its place, and it was wrong. The
      loop was run to demonstrate the stability mechanism, on the assumption
      that a tree with 743 green tests and every registry checked would add
      nothing. It added this within one run.
    outcome: |-
      records/DRAFT-the-base-is-the-deliverable.md declared `Restated in:
      AGENTS.md`. AGENTS.md does not name the record, so a reader stopping at
      the entry page is never told the record exists. ci/check_restatements.py
      verifies the pair in both directions and failed on it -- the first loop
      pass after the record was committed.

      The row now states nothing, and the record carries a section saying it
      loses on readership until a passage is written into AGENTS.md. That is a
      documentation-lane change against a page already over its reading budget,
      and was not made here.

      The pass that found this is recorded as having added an entry, so the
      streak returns to zero. That is the criterion working: the base moved.
    failure_cost: |-
      None yet -- the declaration never reached main. Had it, the corpus would
      have carried a rule pointing at a restatement that did not exist, which is
      the precise failure records/DRAFT-the-read-document-governs.md was written
      about, asserted by the record that cites it.
    outcome_matched_projection: false
    lessons:
      - >
        A `Restated in` row is a claim about a second document, and writing it
        beside the intention rather than beside the passage makes it false at
        the moment it is written.
      - >
        The first pass after a change is the one that finds things. Recording a
        pass before acting on what it found would have logged a quiet result for
        a run that was not quiet.
    status: closed
  - id: 2026-08-16-009
    tool: assistant-2026-08
    kind: fix
    action: Remediate every private repository name in the tree, one file at a time
    found_by: >
      An operator instruction to surface and remediate each occurrence
      individually, rather than declaring them as a class.
    projected_impact: |-
      Not pre-written; this was directed file by file. The standing expectation
      was that eleven occurrences across six files would be redacted and the
      matter closed, because that is what the check reported.

      That expectation was wrong in both directions at once, and the checking
      was the part that was wrong.
    outcome: |-
      Six files remediated as directed: two status generators now redact a
      private repository everywhere they emit a name, a test fixture uses an
      obviously fake name, an audit table carries references and keeps both
      rows, and four handbook pages name repositories by reference.

      The check itself held three defects, each found by acting on its output:

      1. It read `repositories` from both companions, but inventory-private.json
         stores its mapping under `references`. It knew 2 private names of 34.
         Every `clean` it had reported meant "the roster's two names are absent".
      2. Reading all 34 produced 240 hits and almost no disclosures. One private
         repository is named after the organisation, matching 187 URLs; several
         others are ordinary words of three, five and nine letters. Findings are
         now tiered: a name used *as* a repository is a finding, a bare word in
         prose is `possible` and never gates.
      3. Tiering on context alone then demoted a genuine disclosure -- a handbook
         sentence listing repositories has no slash and no quotes. The tier keys
         on whether the *name* is ambiguous, not on the context.

      Redacting governance-status.yaml also broke its own faithfulness check,
      which re-derives the git layer and compares by project name. A redacted
      document cannot be bound to a `project/<name>` ref offline. It now
      resolves references through the gitignored companion where present and
      reports the rest as unresolved rather than as differences: 214 of 214
      fields verified locally.

      Gated on main by .github/workflows/private-names.yml, which asks the host
      what is private because a runner has no local source. 762 tests, 8 of 8
      mutations caught after two survivors exposed two real test gaps.
    failure_cost: |-
      Two own-goals, both in the work whose subject is not making them. A
      private repository name was printed into the session transcript by
      inspecting a mapping's values instead of its structure. And four real
      private names were used as example literals in the test file for the check
      that forbids them -- caught by that check, on the branch, before the
      commit reached main.

      The nested-backtick repair in one handbook page was found by reading the
      diff rather than by any check; a sweep that rewrites prose can produce
      valid-looking markup that is wrong.
    outcome_matched_projection: false
    lessons:
      - >
        A check that reads one of two storage shapes reports clean about the
        shape it read. The count it is checking against is worth printing --
        "33 private names checked" would have exposed "2" immediately.
      - >
        Making a check see more can make it useless rather than better. 240
        findings with no disclosures is a check nobody runs, which enforces
        less than one that fires twice.
      - >
        Redaction breaks anything that joins on the redacted value. The
        document's own verifier joined on the project name, and the redaction
        that protected the document defeated the check that made it trustworthy.
      - >
        Inspect structure, not values, when the values are the secret. Printing
        a mapping's first value to learn its direction published a name.
    tests_generated:
      - ci/tests/test_check_private_names.py -- boundary, tiering, the org
        exclusion, both companion shapes, and a host failure that must not read
        as clean
      - 8 of 8 mutations caught against an asserted-green baseline
    status: closed

  - id: 2026-08-20-001
    tool: assistant-2026-08
    kind: fix
    action: Read a commit trailer, which nothing in this corpus had ever done
    found_by: >
      An operator instruction to review how accreditation and command execution
      were being treated. The review found that the reviewer had put a vendor
      no-reply co-author trailer on three commits in that same session, having
      read the rule forbidding it, and that a full set of green checks had
      nothing to say about any of them.
    projected_impact: >
      Written before building, in the exchange that authorised it: the check
      that would have caught this does not exist anywhere in the corpus.
      check_attribution.py reads commit subjects and record prose; no seed
      workflow invokes it at all, so an adopting project gets the script and no
      gate that runs it. Expected to be a small script change plus one workflow
      step, and expected to need an adversarial pass before it could be trusted.
    outcome: >
      A third check on --base-ref: every commit trailer and the author field,
      failing on two independent grounds -- the name is a tool's, or the address
      is one nobody reads -- reported separately, because deleting a byline and
      naming somebody reachable are different fixes. Git parses the trailers;
      a regex beside git's definition would disagree with the forge, which uses
      the same one. The seed adr-lint.yml now invokes it, so the gate reaches
      every adopting project on its next pin bump rather than none of them.

      The adversarial pass found two holes and one cosmetic defect, all closed:
      the per-user-alias exemption was unconditional on the host label, so any
      no-reply local part at a host named users.noreply.<anything> inherited it;
      a bare address with no angle brackets fell through to the name check and
      matched on the domain, refusing a real contributor's address with the
      words "names a tool"; and a bad --base-ref printed the same sentence twice
      under a count of two.

      30 adversarial cases, 30 right. 158 seed tests, 18 new, 9 of them watched
      failing against the unpatched checker -- the rest are overfire guards that
      must pass either way. Driven end to end by putting a violating commit on a
      real branch and watching the real gate go red.
    failure_cost: >
      Two rebuilds of the same patch. The first was written through a shell
      heredoc, which collapsed one level of backslash escaping and turned an
      escape inside an f-string into a real newline; reverted and reapplied from
      a file. And the exemption hatch was written before it was needed --
      an empty dict with a paragraph explaining it -- then removed, because this
      check runs over a pull request's own commits, which their author can still
      amend, so the hatch would only ever have been an invitation to add the
      first red rather than fix it.
    outcome_matched_projection: true
    lessons: >
      A rule every surface describes as enforced is the one worth checking a
      detector exists for. Three documents here said the co-author trailer was
      already forbidden -- the record, the seed AGENTS.md, and the corpus's own
      workflow comment -- and the agreement between them is what made it look
      settled. None of them was a detector.
    status: closed

