  - id: 2026-08-15-002
    reconstructed: true
    kind: fix
    action: "Grandfather unsigned history the corpus cannot rewrite"
    projected_impact: >
      Keep the gate enforceable without requiring a forbidden act, and count the
      exempted commits as debt rather than hiding them
    outcome: >
      ENFORCED_FROM cutoff. Caught the gate's own summary claiming "All 16
      commits carry a signature" when nine did not.
    failure_cost: >
      Two heredoc-escaping cycles and one half-applied patch that left
