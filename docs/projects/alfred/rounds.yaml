    began: 2026-10-18
    ended: 2026-10-18
    head: 66fa6186
    carried: >-
      media access and storage, the editor again, accounts and the timeline
      API, dependencies, and the engine (otto pinned at e050396,
      `fix/engine-wave2`)

  - round: 3
    branch: integrate/wave-3
