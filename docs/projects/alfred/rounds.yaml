# alfred's development rounds: the curated half of its timeline.
#
# A person keeps this file; `uv run qm timeline alfred --write` draws
# timeline.md from it and from git.yaml. Each round names the branch it was
# integrated on, the pull request that carries it, the dates of its commits and
# the commit its branch stood at, and what it carried. `measured` holds the
# counts each round's runs reported, at the commit or branch they ran on, and
# `noted` the counts alfred's release notes carried.
#
# Shape, read by ci/timeline.py, which refuses anything else:
#   rounds:   round, branch, pr, title?, began, ended, head?, carried
#   measured: rounds (a list), at, results (suite, result), also?
#   noted:    version, section, text

project: alfred
repository: quaternionmedia/alfred
default_branch: main
source: >-
  alfred's [`CHANGELOG.md`](https://github.com/quaternionmedia/alfred/blob/ec60239a/CHANGELOG.md)
  at `ec60239a`, on `docs/one-pass`, for rounds 1 to 13, whose heads are their
  branches' commits on 2026-10-31; each later round is added as it closes,
  with its head the commit it closed at. Each round's dates are its commits'
  dates in alfred's git, and its title is its pull request's.
about: >-
  fixes from a review of alfred and otto, landed in rounds of parallel
  branches, each round integrated on a branch stacked on the round before.

rounds:
  - round: 1
    branch: integrate/review-fixes
    pr: 127
    title: >-
      The review's first round fixes the render pipeline, auth and ownership,
      the editor and CI, and adopts otto's engine contract
    began: 2026-10-17
    ended: 2026-10-17
    head: c3b313e6
    carried: >-
      the render pipeline, auth and ownership, the editor, CI and operations,
      and the engine (otto `fix/engine-contract`)

  - round: 2
    branch: integrate/wave-2
    pr: 128
