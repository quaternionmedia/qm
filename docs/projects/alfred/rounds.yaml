      Every setting reaches its service, no request waits on a preview, the
      timeline's sound comes from otto, and the phone keeps the whole picture
    began: 2026-10-18
    ended: 2026-10-18
    head: 2de7f896
    carried: >-
      the review's fix round: every setting reaching the services that read
      it, CI installing what the image installs, the workspace's tab race and
      the suite's timing races, docs that describe the API as it answers, the
      timeline's sound written by otto (pinned at f3ceca3,
      `fix/engine-sound`), an api whose one event loop no longer waits on a
      preview, and a phone layout that keeps the whole picture on the screen

  - round: 5
    branch: integrate/wave-5
    pr: 131
    title: >-
      Password hashing leaves the event loop, media work moves into otto,
      refusals carry codes, and ./al family runs the family
    began: 2026-10-18
    ended: 2026-10-19
    head: d5f929c2
    carried: >-
      the decisions round 4 stopped at: password hashing off the event loop
      behind loud safeguards, the media work moved into otto (pinned at
      7ddbf10, `feat/engine-media-ops`), a code beside every refusal of the
      routes qmcp calls, a cap on concurrent previews, support mail sent by
      the worker, the render extra and the docs build tightened, and `./al
      family`, which runs alfred with the repositories it works with

  - round: 6
    branch: integrate/wave-6
    pr: 126
    title: >-
      The docs say less and show first, are checked against the code, and the
      stack has a demo
    began: 2026-10-19
    ended: 2026-10-23
    head: e2e52506
    carried: >-
      the docs: every page this effort touched said in fewer words, across the
      repositories, and the main pages opening with screenshots that `./al
      recipes` takes from demo data, its GIFs kept out of git (otto f106775
      and vox e630cb0, for their docs); then the docs checked against the
      code, the font list's parse tested, and the project filter test making
      the projects it filters

  - round: 7
    branch: feat/journeys-and-onboarding
    pr: 132
    title: "Round 7: the editor's journeys and the way in"
    began: 2026-10-24
    ended: 2026-10-24
    head: f09ae291
    carried: >-
      the editor's journeys and the way in: the phone flow fitting a phone,
      templates named in words, the empty viewer saying where to start, and a
      Get started page with the docs in the order a newcomer reads them

  - round: 8
