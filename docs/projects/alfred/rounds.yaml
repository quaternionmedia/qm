      Round 8: the gaps left open are closed, and the recordings play only in
      docs served locally
    began: 2026-10-24
    ended: 2026-10-24
    head: 5443bcbe
    carried: >-
      the gaps left open: the Render stage's form and the zoom row on every
      screen, the tests the review asked for (the recipes' pipeline, `./al`'s
      dev key, `./al family`, `GET /fonts`) and the three bugs they found, the
