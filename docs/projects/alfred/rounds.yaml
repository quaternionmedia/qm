noted:
  - version: Unreleased
    section: Security
    text: >-
      Open advisories in the image's dependencies go from 82 to 20, with
      python-multipart 0.0.32, Pillow 12.3, python-jose, ecdsa and rsa
      removed, and the lock refreshed within its ranges.
  - version: "0.3.0"
    section: Fixed
    text: >-
      The broken logo cost eleven 404s per session in the API log.
  - version: "0.3.0"
    section: Added
    text: >-
      The backend test suite holds 236 tests plus 19 strict `xfail`s that pin
      known defects, with one real 320×240 encode.
  - version: "0.3.0"
    section: Removed
    text: >-
      The JS bundle's content hash is unchanged either side of removing
      `website/src/logic.js`, `resizable.js` and `sortable.js`
      (`website.5e1ea2fd.js`, 279.86 kB).
