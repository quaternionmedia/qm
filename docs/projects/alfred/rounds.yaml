  - round: 9
    branch: feat/edit-by-text-and-loop
    pr: 134
    title: >-
      Edit by text, a test loop of named runs, and the suite's screenshots of
      every tool and example
    began: 2026-10-25
    ended: 2026-10-26
    head: 4073abfc
    carried: >-
      edit-by-text on top of the joe and vox loop; `./al loop`, the suites
      side by side as named runs, and images named per checkout; screenshots
      of every tool and docs example taken by the suite, the examples on demo
