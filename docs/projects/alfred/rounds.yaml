    began: 2026-10-26
    ended: 2026-10-26
    head: 31b8acf6
    carried: >-
      pydantic 2 in alfred and the engine (otto pinned at c82efbd,
      `feat/pydantic-2`); fastapi-users 15.0.5, with passwords hashed by
      Argon2 in a pool of their own; passlib and setuptools gone

  # Rounds 11 and 12 are carried by one pull request: round 11's branch is
  # contained in round 12's, which is the pull request's head.
  - round: 11
    branch: feat/family-onboarding
    pr: 136
    title: >-
      Rounds 11 and 12: the family guide, qm's ports, and the editor's user
      journeys
    began: 2026-10-29
    ended: 2026-10-30
    head: 27d543bc
    carried: >-
      making a video in the QM family, walked step by step
      ([`docs/guide.md`](https://github.com/quaternionmedia/alfred/blob/main/docs/guide.md),
      `./al family up`); editing by text completed (undo, the timeline tools
      carrying the words, a cut rewriting a caption's text); comments cut to a
      line or two, their reasons moved into the docs; the seed's workflows,
      with `governance/qm` at the propagation; the dev stack on 1732 and joe
      on 1059, qm's port allocation

  - round: 12
    branch: feat/ui-journeys
    pr: 136
    title: >-
      Rounds 11 and 12: the family guide, qm's ports, and the editor's user
      journeys
    began: 2026-10-31
    ended: 2026-10-31
    head: ca6be6ba
    carried: >-
      the editor made for the person using it: a line under the rail saying
      what to do next, the timeline saving itself, New project, and the user
      journeys
      ([`docs/journeys.md`](https://github.com/quaternionmedia/alfred/blob/main/docs/journeys.md))
      that the editor's How? links open; `governance/qm` at project/alfred's
      propagation of 2026-10-31

  - round: 13
    branch: docs/one-pass
    pr: 137
    title: >-
      Round 13: the docs in six sections, the cookbook an index, and otto's
      timeline in otto
    began: 2026-10-31
    ended: 2026-10-31
    head: ec60239a
    carried: >-
      the docs in six sections, as qm's own site lays out its: the cookbook
      cut to the browser suite's index, each walkthrough played on the journey
      it walks; Get started a journey to the running editor; Configuration by
      purpose; the questions a new developer asks; otto's timeline format in
      otto (pinned at 51a1b0e, `docs/timeline`), and vox's and joe's rules
      left to their own docs

  - round: 14
    branch: feat/generic-form-and-lighter-ui
    pr: 139
    title: >-
      Round 14: a form project any user can make, and an editor drawn lighter
    began: 2026-11-01
    ended: 2026-11-01
    head: f24d8126
    carried: >-
      the seed's car-dealer form projects replaced by Announcement, a
      templates-only form any account can add from
      `alfred/examples/announcement.json`, with the form component named
      `ProjectForm`, a line under the rail that sends a form project to
      Render, and the journey From a form; the editor's lines at one pixel
      and its text at one weight, with every screenshot retaken

