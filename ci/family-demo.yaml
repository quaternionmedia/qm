# The performing family, as one demo: which branch of each member runs, on
# which port, and the two commands every member answers.
#
# Read by ci/family_demo.py (`uv run qm family-demo`). Hand-authored, so it is
# a claim and lives in ci/ per handbook/config-standard.md: it states what the
# demo will ask of each member. What each member actually did is the run's
# manifest, written outside the repository on every run and never committed.
#
# EVERY NAME HERE IS A ROSTER NAME. A member is resolved to a clone through
# ci/workspace.yaml exactly as `qm estate` resolves it, and the harness refuses
# a member the roster does not carry. Which family a member belongs to is the
# roster's claim, not this file's; this file only says when it joins the demo.
#
# A PHASE THAT DOES NOT RUN IS STILL LISTED. Its members are declared with a
# reserved port and with what each needs before it can join, so the demo's
# denominator is the whole performing family rather than whatever happened to
# start. A family member this file does not place at all is printed as
# unplaced by every run.
#
# WHO OWNS WHICH CHECK. A check of one member alone -- its selectors, what its
# screen must show -- lives in that member, behind the contract's `check`.
# What needs several members, or the machine, lives here, in ci/family_demo.py:
# every member up at once, each on its own ports and nothing else's, its state
# in its scratch directory and its checkout untouched, and any seam between
# two members. The demo knows no member's selectors.
#
# WHICH COMMIT. A running member names the `branch` that carries the contract,
# stacked on the active work it sits on (`stacks_on`), and the harness resolves
# it in the roster's clone: a local branch first, then `origin/<branch>`. The
# manifest records which, and whether the branch really contains `stacks_on`.
# `choice` says why that line of work, where choosing was a judgement.
# `--ref <member>=<ref>` overrides the branch for one run.
#
# PLACEHOLDERS in commands, environments and URLs:
#   {checkout}     this run's own clone of the member, at the resolved commit
#   {state}        this member's scratch directory for this wave
#   {host}         the address every member binds
#   {port}         the member's served port (`serves`); {port:<name>} any of its ports
#   {url}          the member's `url`, expanded
#   {shots}        where this wave's check writes its pictures
#   {token}        a string unique to this run
#
# Every port sits inside `ports`, and every member's default port is replaced
# on its command line: the defaults collide, and a developer's own server is
# usually up on one, so measuring it would test whatever happened to be running.

schema: 2

ports:
  first: 18400
  last: 18499

host: 127.0.0.1

# THE CONTRACT. Every member that runs is started with `serve` and checked with
# `check`, appended to its `entry`, and with nothing else.
#
#   serve  serves the member on {host}:{port} until interrupted, every database,
#          log and data file it makes under {state}; it binds no port it was
#          not given, and answers 2xx at its `url` only once it can be checked.
#   check  runs the member's own behavioural check against the instance already
#          answering at {url} -- it starts none -- and writes every picture it
#          takes under {shots}. Exit 0: every assertion held. Exit 1: one did
#          not. Any other status: the check could not say, and its last line of
#          output says why.
#
# A member that cannot honour it yet carries a stub: `serve` that refuses, or a
# `check` that prints `not_implemented` and exits non-zero. A stub is reported
# as not implemented, never as a pass.
contract:
  serve: [serve, --host, "{host}", --port, "{port}", --state, "{state}"]
  check: [check, --url, "{url}", --shots, "{shots}"]
  not_implemented: "not implemented"
  # How long one check may run. joe's runs its audio pipeline, which imports
  # librosa and music21 before it answers.
  check_seconds: 600

# The browser the demo's own check of its page drives. Pinned, so that check is
# the same on every run; the pin must match a Chromium build already installed,
# and the harness says so rather than downloading one. A member's check brings
# its own browser.
browser:
  playwright: "1.62.0"
  python: "3.12"

phases:
  - id: core
    runs: true
    note: >
      The hub, the timer, the rack and the two performer displays. The first
      slice of the simultaneous-run plan, and the only phase that starts.
  - id: instruments
    runs: false
    note: >
      Looping, MIDI control and mixing. Joins once each member has a baseline of
      its own and a target that touches no real device.
  - id: show-control-libraries
    runs: false
    note: >
      Client libraries and transport scripts with no surface of their own. They
      join through a hub's plugin seam or a fake endpoint, not as processes.

members:
  # --- core ---------------------------------------------------------------

  - name: ShowRunner
    phase: core
    branch: feat/family-demo-contract
    stacks_on: feat/walkthrough
    choice: >
      Two lines are active: the owner's pull request adding the ShowMidi plugin,
      and a split series of the UI tests and the walkthrough. The series is the
      one run: ShowMidi changes nothing on the surface this demo drives and
      needs MIDI hardware this demo does not touch, and the series carries the
      browser page the check is.
    install:
      - [uv, sync, --all-extras, --frozen]
    entry: [uv, run, --no-sync, --project, "{checkout}", sr]
    ports: {http: 18400}
    serves: http
    url: "http://{host}:{port:http}/"

  - name: ShowStopper
    phase: core
    branch: feat/family-demo-contract
    stacks_on: tests
    install:
      - [uv, sync]
    entry: [uv, run, --no-sync, --project, "{checkout}", showstopper]
    ports: {web: 18410}
    serves: web
    url: "http://{host}:{port:web}/"
    deviations:
      - >
        No lock the installer reads: the repository carries a pdm lock, so the
        environment is resolved at install time, and `uv sync` writes a uv.lock
        into the clone, which is recorded and not counted as a write by the run.
      - >
        Its check drives the stopwatch through Textual's pilot in the check's
        own process, and asserts of the served address only that it streams the
        app: textual-serve starts an app per connection, so there is no single
        running app to drive.

  - name: carlos
    phase: core
    branch: feat/family-demo-contract
    stacks_on: fix/dials-cable-ends-and-scroll
    install:
      - [uv, sync, --frozen]
    entry: [uv, run, --no-sync, --project, "{checkout}", carlos]
    ports: {http: 18420}
    serves: http
    url: "http://{host}:{port:http}/rack"
    # What the member says about itself, asked before its check: the socket
    # that answered, and the database it resolved. A stale server or a shared
    # database is caught here before the rack is attributed to this run.
    identity:
      url: "http://{host}:{port:http}/healthz"
      port: port
      state: database

  - name: joe
    phase: core
    branch: feat/family-demo-contract
    stacks_on: docs/walkthrough-after-docs
    choice: >
      The voice-loop stack with both of its stacks merged, the documentation
      pull requests on top, and the walkthrough on those: every open line of
      joe's work in one tip. It differs from the walkthrough on the voice loop
      alone in README.md and docs/cookbook.md only.
    install:
      - [uv, sync, --frozen]
      - [npm, ci, --no-audit, --no-fund]
    entry: [uv, run, --no-sync, --project, "{checkout}", joe]
    # `qmcp` is reserved and never bound: the page's qmcp proxy points at it, so
    # a qmcp somebody has running cannot answer, and the check expects none to.
    ports: {web: 18430, api: 18431, qmcp: 18432}
    serves: web
    unbound: [qmcp]
    serve_args: [--api-port, "{port:api}", --qmcp-url, "http://{host}:{port:qmcp}"]
    env:
      JOE_CUES: "0"   # no turn tones: they play on an output device
    url: "http://{host}:{port:web}/joe/"
    # Kept in the clone despite --state: the API resolves Data/ against its
    # working directory, and the pipeline and voice modules against the
    # checkout. Emptied in this run's own clone before each wave.
    state_in_checkout: [Data]

  - name: leo
    phase: core
    branch: feat/family-demo-contract
    stacks_on: walkthrough
    choice: >
      The setlist pull request, with the walkthrough on it that asserts a chart
      and a setlist filter.
    install:
      - [uv, sync, --frozen]
      - [npm, ci, --no-audit, --no-fund]
    entry: [uv, run, --no-sync, --project, "{checkout}", leo]
    ports: {web: 18440}
    serves: web
    url: "http://{host}:{port:web}/"

  # --- instruments: declared, not run ---------------------------------------

  - name: holophonor
    phase: instruments
    ports: {main: 18450}
    needs:
      - the contract's serve, opening no MIDI or audio device
      - a fixed message script the plan's instrument wave can replay

  - name: midiphonor
    phase: instruments
    ports: {main: 18455}
    needs:
      - its browser target named, and the contract's serve on a given port
      - a check that is not a placeholder

  - name: wolf
    phase: instruments
    ports: {main: 18460}
    needs:
      - the contract, with a dry-run MIDI target; its default branch is dormant
        and carries no tests

  - name: ludwig
    phase: instruments
    ports: {main: 18465}
    needs:
      - a fake mixer target; it is hardware-facing and must not reach a desk

  - name: waveofhormuz
    phase: instruments
    ports: {main: 18470}
    needs:
      - a branch with active work named, then the contract

  - name: qmetronome
    phase: instruments
    ports: {main: 18475}
    needs:
      - an emulator or device harness; it is an Android build and this demo
        provisions browsers only

  # --- show-control libraries: declared, not run ----------------------------

  - name: Cuelist-python
    phase: show-control-libraries
    ports: {main: 18480}
    needs:
      - a ShowRunner plugin entry point the hub loads, so it joins inside the
        hub's process rather than beside it

  - name: QLab-python
    phase: show-control-libraries
    ports: {main: 18484}
    needs:
      - a fake QLab endpoint on a reserved port

  - name: TheatreMix-python
    phase: show-control-libraries
    ports: {main: 18488}
    needs:
      - a fake TheatreMix endpoint on a reserved port

  - name: cesar
    phase: show-control-libraries
    ports: {main: 18492}
    needs:
      - a mode with no DMX or video output device

  - name: aes
    phase: show-control-libraries
    ports: {main: 18496}
    needs:
      - a loopback-only sender and receiver pair, measured for drops
