  - name: factorio-sysops
    role: project
    phase: v0.0.1
    phase_source: scaffolded
    paths: [factorio-sysops, qm/factorio-sysops]

  # Both of these carry a project/<name> branch in this repository, so the
  # corpus governs them, and both were absent from this roster -- which meant
  # `qm inventory` reported them under "the corpus cannot see these" while the
  # corpus was propagating into them. Neither is cloned in this workspace, so
  # nothing here can see whether either holds unpushed work.
  - name: carlos
    role: project
    phase: v0.0.1
    phase_source: stated
    note: >
      Browser workspace for sketching synth rigs, governed via project/carlos.
      `stated`, not `scaffolded`: carlos names the rung in its own
      GOVERNANCE.md, so the claim is the project's rather than an inference
      drawn from what it happens to contain. It is what the project works
      toward and not an attainment -- nothing here is evidence, and the tag
      that would assert arrival has not been cut. Its default branch is `they`,
      not `main`, and that branch last moved in 2025 while the host reports a
      push today, which is the discrepancy that made this roster gap visible.
    paths: [carlos, qm/carlos]

  - ref: private-34
    role: project
    phase: v0.0.1
    phase_source: scaffolded
    note: >
      Name and paths live in ci/workspace-private.yaml, which is not
