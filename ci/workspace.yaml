    note: code maps; named itself a v0.0.2 RAD consumer
    paths: [codecartographer, qm/codecartographer]

  - ref: private-32
    role: project
    phase: v0.0.1
    phase_source: scaffolded
    note: >
      Name and paths live in ci/workspace-private.yaml, which is not
      committed. This repository is private, and a public roster that
      named it would defeat the inventory's own redaction of the same
      repository as private-32.

  - ref: private-33
    role: project
    phase: v0.0.1
    phase_source: scaffolded
    note: >
      Name and paths live in ci/workspace-private.yaml, which is not
      committed. This repository is private, and a public roster that
      named it would defeat the inventory's own redaction of the same
