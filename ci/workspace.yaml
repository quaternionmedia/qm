# The QM repository roster, and where each one sits in a local checkout.
#
# Input to ci/make_workspace.py, which writes a multi-root VS Code workspace.
# It is committed because the roster is org knowledge -- which repositories
# exist, what governs them, which release phase each is working toward -- and
# that knowledge has so far lived only in whichever session last asked.
#
# `paths` is a list of candidates relative to the search roots the generator is
# given, because these clones are not all siblings: some are under repos/qm/,
# some under repos/, and one is wherever the Android tooling puts it. The
# generator reports which candidate it resolved, and reports a repository it
# could not find as MISSING rather than dropping it from the list.
#
# `phase` is what this project is working toward, per the phase-ladder record
# in `records/`. Two halves, and they behave differently:
#
#   v0.0.1  governance. The same claim in every project: records on its own
#           project/<name> branch, pin current, seed files present on the
#           default branch, and a human who reviewed and tested that it is so.
#   v0.0.2+ defined by the project, in the project's own records. A project
#           that has not written that definition has a word, not a rung.
#
# A project with nothing stated is `v0.0.1`. That is a default and not a
# discovery: governance binds every project whether or not anybody has thought
# about its roadmap, and it is a claim any project can be measured against on
# day one.
#
# `phase_source` keeps the claim readable as a claim:
#
#   stated      a human said it, in a session or a record
#   scaffolded  nothing was said, so the ladder's floor applies
#
# NOTHING HERE IS EVIDENCE. This file holds what people have asserted. What is
# actually true of a repository is computed from `governance-status.yaml`,
# which is generated from git and the host rather than from anybody's account
# of them, and the two are shown side by side so the gap survives. A claim is
# never rewritten to match its evidence, and a claim is never inferred from
# artifacts -- that second one would quietly redefine adoption as a filename
# check, which is the substitution the status generator refuses to make.

schema: 1

# --- Org-level parameters: what this corpus is working toward ---------------
#
# THIS IS A CLAIM, like every `phase` below it. A human states the milestone and
# what it requires; nothing here is derived from the repository, and nothing in
# the repository is edited to match it. `ci/doc_status.py` reads this block into
# `doc-status.json`'s `readiness` layer and reports the *measured* figures beside
# it, so the gap between what was declared and what is true survives.
#
# `version` is the corpus's own, and it is deliberately null: `qm` carries no
# `v*` tag, and per records/DRAFT-version-tags-are-claims.md 4 an untagged
# repository has made no release claim. Writing a number here would be the
# release claim the record says a tag is the only way to make.

milestone:
  name: alpha
  target_version: v0.1.0
  version: null            # no v* tag on this corpus; nothing is claimed
  version_source: "records/DRAFT-version-tags-are-claims.md 4"
  audience: >
    Developers and power users outside QM, onboarded as testers. They read the
    corpus cold, with none of the session history that built it.
  requires:
    - id: ratification-rehearsed
      what: "At least one record ratified end to end, so the five-step path has been walked once"
      measured_by: "doc-status.json readiness.records.ratified"
    - id: reading-within-budget
      what: "Mandatory reading before a first edit stays under its budget"
      measured_by: "doc-status.json reading_load.within_budget"
    - id: no-unknown-document-states
      what: "Every governed document's state can be established"
      measured_by: "doc-status.json totals.unknown"
    - id: gates-declared-are-built
      what: "No gate is declared and unbuilt, or the gap is deliberate and named"
      measured_by: "gate-status.json totals.declared_not_built"
    - id: semantic-review-done
      what: "All records read in one sitting for contradiction, which no check can do"
      measured_by: "not mechanisable -- a human says so, in a handoff or a record"

repositories:
  - name: qm
    role: corpus
    phase: n/a
    phase_source: n/a
    note: the constitution; every other entry adopts it by reference
    paths: [qm/qm]

