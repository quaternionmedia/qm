# The capability registry: what each named thing this estate can do has reached,
# and what nobody has established about it.
#
# A CAPABILITY IS NOT A DELTA. A delta is a unit of work and it ends. A
# capability persists after the change that introduced it closed, and it is at
# its most dangerous exactly then -- designed, merged, and reachable by nobody.
# `records/DRAFT-a-capability-has-four-phases.md` is the decision; the four
# rungs and what each declines to claim are stated there and not restated here.
#
# `phase` IS A CLAIM A HUMAN MADE, AND NOTHING DERIVES IT. That is clause 3 of
# the record, inherited from the project phase ladder: the claim and the
# evidence are separate documents and neither may be rewritten to match the
# other. A generator that read the evidence and set the phase would delete the
# only signal worth having -- the gap between them.
#
# THE EVIDENCE FIELDS NAME WHERE TO LOOK, NOT WHAT WAS FOUND. Each is a pointer
# a reader or a window can follow: a path for `design`, a command for
# `deployment`, an address pattern for `execution`, a document for `monitoring`.
# `null` means nobody has established it, and `null` is not `false` -- a rung
# with no evidence is unknown, never failed. Clause 5.
#
# WHY DEPLOYMENT HAS ITS OWN RUNG. It is the one that fails without a symptom.
# Six of ten `uv run qmcp ...` commands named in that package's own docstrings
# did not exist on 2026-08-25; the modules imported, their functions worked and
# their tests passed. Nothing was red.
# `perspectives/2026-08-25-defects-between-two-green-suites.md` has the four
# defects and their commands.
#
# A WINDOW RENDERS THIS AND ADDS NOTHING. `dossier` and `codecarto` are two
# views of one estate. A phase named in one must mean the same thing in the
# other, so the words live here.
#
# ADDING A CAPABILITY IS AN EDIT TO THIS FILE. `python ci/capabilities.py
# --check` refuses a declaration nobody could act on.

schema: 1

capabilities:
  - id: qmcp/governed
    title: The governed seam
    repo: quaternionmedia/qmcp
    phase: execution
    stated_by: Peter Kagstrom
    stated_on: 2026-08-25
    what: >-
      One door a model's output comes through: a fixed sequence of total stages
      around exactly one call to something with no halting guarantee, budgeted
      before and bounded after, ending at the human-in-the-loop queue.
    evidence:
      design: records/DRAFT-shrink-the-black-box.md
      deployment: uv run qmcp topology show governed --level 2
      execution: quaternionmedia/qmcp/ask/governed-
      monitoring: null
    cannot_see: >-
      Whether a draft it produced was any good, and whether the person who
      answered the queue entry read it. Both are the point of the seam and
      neither is visible from here.

  - id: qmcp/declared-commands
    title: Every declared command resolves
    repo: quaternionmedia/qmcp
    phase: monitoring
    stated_by: Peter Kagstrom
    stated_on: 2026-08-25
    what: >-
      A check that every `uv run qmcp ...` named in that package, its docs, its
      README or its quickstart dispatches to something. The deployment rung of
      clause 4, implemented for one package.
    evidence:
      design: records/DRAFT-a-capability-has-four-phases.md
      deployment: uv run qmcp test tests/test_declared_commands.py
      execution: quaternionmedia/qmcp/invocation/
      monitoring: .github/workflows/tests.yml
    cannot_see: >-
      A command named in a place it does not scan -- `tests/` is excluded on
      purpose -- and whether a command that resolves does anything useful.

  - id: dossier/trim
    title: Trimming branches main already has
    repo: quaternionmedia/dossier
    phase: execution
    stated_by: Peter Kagstrom
    stated_on: 2026-08-25
    what: >-
      A sweep of one clone's local branches, listing what is already an ancestor
      of the default branch and removing it only when told. Its result is one
      delta.
    evidence:
      design: records/DRAFT-deltas-compose.md
      deployment: uv run dossier trim dossier
      execution: quaternionmedia/dossier/delta/trim-
      monitoring: null
    cannot_see: >-
      Whether a branch it left alone is spent. A squash or rebase merge leaves
      no ancestry link, so the sweep under-removes and says so.

  - id: dossier/harness-queue
    title: The harness queue, whole
    repo: quaternionmedia/dossier
    phase: execution
    stated_by: Peter Kagstrom
    stated_on: 2026-08-25
    what: >-
      A reading of what is waiting on a person that reports how many rows the
      harness held back, and distinguishes none held back from nobody said.
    evidence:
      design: perspectives/2026-08-25-defects-between-two-green-suites.md
      deployment: uv run dossier harness ingest
      execution: quaternionmedia/dossier/invocation/
      monitoring: null
    cannot_see: >-
      Whether anybody answers the questions it surfaces. A queue that is read
      and never acted on renders exactly like one that is.
