# Pictures a project shows on its page in the docs site, from its own repository.
#
# A person picks them; nothing infers a picture. Each path is a file committed on
# the project's default branch and is shown from there
# (https://github.com/<org>/<project>/raw/HEAD/<path>), so the picture is the
# project's own and changes when the project changes it. A caption says what the
# picture shows, in one sentence. A project with no entry has a page with no
# pictures, which says so rather than borrowing one.
#
# A listed picture the default branch does not hold yet -- one still on a pull
# request -- is not shown: `uv run qm inventory --write` records which listed
# files each default branch holds, and the page shows only those.
#
# A project may also have a detail page, written here under `details:` by a
# person, the way captions are. Every section of a block is optional; within
# one, a `title`, a `name` and a `text` are required where they appear, and an
# unknown key is refused rather than dropped:
#
#   lede      what the project is, a sentence or two, in place of the host's
#             one-line description
#   try       `run`: the command, or commands, to try it; `then`: what to do next
#   picture   the one the page opens with: a path and a caption
#   steps     `eyebrow`, `title`, and `items`, each a `name` and one line of
#             `text`, with an optional `picture`: the steps a user goes through
#   features  each an `eyebrow`, a `title`, a paragraph of `text`, and `pictures`
#   built     `eyebrow`, `title`, `text`, and `parts` and `beside`, each a `name`,
#             how it connects (`via`) and a line of `text`: how it is built. A
#             part named as a project with a page links to that page.
#
# Text is markdown, set as written, and states what is true of the project at
# any commit: no dates, pull request numbers or measured counts, which belong in
# the project's own changelog. Its pictures are the project's own, held back
# like the ones above until its default branch holds them, and the inventory
# asks about every path a block names. A project with no block keeps the page
# its pictures above make. The detail page shows the block's pictures; the
# pictures above stay the project's cards on the family pages and the front page.
#
# `uv run qm cookbook docs/families --site --write` reads this file;
# ci/tests/test_cookbook.py holds its shape. `uv run qm cookbook --preview <dir>
# --ref <project>=<ref>` builds the site outside the committed one, with a
# project's pictures from a branch it names: docs/usage/build-these-docs.md.
projects:
  alfred:
    - path: docs/assets/screens/edit.png
      caption: The editor, a title template selected, with the viewer, the timeline and its settings.
    - path: docs/assets/screens/captions.png
