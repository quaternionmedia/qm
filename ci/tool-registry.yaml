    operator: Peter Kagstrom
    in_use_from: 2026-06-09
    in_use_to: null
    disclosed_in:
      - PRINCIPLES.md
    note: >
      Present so an entry produced without a tool has something true to name,
      rather than being attributed to an instrument that was not involved. The
      reviewer's catches are the clearest instance and they belong to a person.
