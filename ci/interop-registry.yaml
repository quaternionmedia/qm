# Contract surfaces, and every repository that sits on one.
#
# The decision is records/DRAFT-a-shared-tag-asserts-interoperability.md: equal
# numbers assert that these artifacts were proven to work together, and unequal
# ones assert nothing about the pair. This file is the list the check reads, and
# the list is the mechanism -- a surface nobody registered is a surface nothing
# compares, which is the state the whole estate was in when a publisher governed
# `0.6.0` while a consumer replayed `0.4.0` and both reported green.
#
# WHY THIS IS LOCAL AND ADVISORY. It reads sibling clones, so it says different
# things on two machines and belongs nowhere near CI -- a runner has no siblings
# and a pull request would go red for a reason its author cannot fix. It is the
# same constraint `ci/devloop.py` carries and for the same reason.
#
# Per surface:
#   publisher        the repository that owns the contract and its version
#   implementations  every repository that pins a version it replayed
#   pattern          a regex with a `version` group, read from that file
#
# A `pattern` rather than a parser on purpose: the pinned version lives in a
# host's own test file, in that host's own language, and requiring a shared
# format would be the coupling the seam exists to avoid.

schema: 1

surfaces:
  - id: rad-interaction-contract
    what: >
      The radial menu's executable interaction contract. The publisher's vector
      set is the measurement; an implementation claims the version it replayed.
    publisher:
      repo: rad
      file: conformance/vectors.json
      json_key: version
    implementations:
      - repo: codecartographer
        file: web/tests/rad/conformance.test.mjs
        pattern: "const PINNED = '(?P<version>[^']+)'"
        covers: >
          the ring, pointer and timing half. It renders a ring and accepts no
          cell input, so the cell cases are reported not-applicable by name.
        proves:
          cwd: web
          command: [npm, run, test:rad]
      - repo: dossier
        file: tests/ui/test_rad_conformance.py
        pattern: 'PINNED = "(?P<version>[^"]+)"'
        covers: >
          the cell-addressing half. It has no pointer to give an angle, so the
          ring, pointer and timing cases are not applicable to it.
        proves:
          cwd: .
          command: [uv, run, pytest, tests/ui/test_rad_conformance.py, -q, -p, "no:randomly", -s]

    # Both implementations print one line in this shape, so `--verify` reads
    # what a run actually covered rather than what a file declares. It is a
    # shared marker rather than a shared format: each host writes it in its own
    # runner, and the only thing agreed across the seam is the sentence.
    coverage: 'rad conformance: (?P<applicable>[0-9]+) applicable, all passing; (?P<not_applicable>[0-9]+) not applicable'
    cannot_see: >
      Whether the union is a real cover. `--verify` runs each host and adds up
      what each reported applicable, and a sum matching a total can still hide
      one case replayed twice and another missed. Proving the cover would mean
      each host naming the cases it executed rather than counting them, which
      no host does today. Without `--verify` it reaches less still: a declared
      string, and no evidence any set was replayed.
