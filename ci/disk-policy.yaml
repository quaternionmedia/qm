# The reclaim policy: every place this org's tooling is allowed to free space,
# and what it costs to get each one back.
#
# This file is the modular half of the disk tooling. `ci/disk_status.py`
# measures exactly what is listed here and nothing else; `ci/disk_reclaim.py`
# deletes exactly what is listed here and nothing else. Adding a target is an
# edit to this file, reviewed like any other change, and requires no code.
#
# WHY A POLICY RATHER THAN A SCRIPT
#
# A cleanup script is a list of deletions with the reasoning left in the head of
# whoever wrote it. Six months later nobody can say whether a line is safe, so
# either it is run unread or it is not run at all. Here each entry carries the
# cost of being wrong, in `safety`, and the reclaimer gates on that field: the
# cheapest tier runs by default and every other tier is opt-in per invocation.
#
# SAFETY IS THE COST OF GETTING IT BACK, NOT A GUESS AT RISK
#
#   refetched    the tool that owns it downloads it again, unprompted, the next
#                time it needs it. Costs bandwidth and nothing else. This tier
#                runs by default.
#   rebuilt      regenerated by a command a human runs -- an install, a build, a
#                browser download. Costs minutes and a working network. Opt in
#                with `--allow rebuilt`.
#   destructive  not automatically recoverable. Something is gone. Opt in with
#                `--allow destructive`, per run, deliberately.
#
# There is no fourth tier and nothing is unclassified: an entry with no `safety`
# is a policy error and the tools refuse the file rather than assuming.
#
# PATHS ARE WRITTEN AGAINST THE ENVIRONMENT, NOT AGAINST ONE MACHINE
#
# `${VAR}` is expanded from the environment. A variable that is not set makes
# the entry `unknown` with that reason -- it is never silently skipped, because
# a target that vanished from a report reads as a target with nothing in it.
# Forward slashes throughout; they are correct on both platforms.

schema: 1

# Free space below which a volume needs a person. Two thresholds, because two
# different actions: `warn` is "schedule an hour this week", `critical` is
# "the next build fails". Ratio and absolute are both checked and the worse one
# wins -- 10% of a 4TB array is 400GB and fine, 10% of a 128GB laptop is not.
thresholds:
  warn_below_free_ratio: 0.15
  critical_below_free_ratio: 0.05
  warn_below_free_gb: 25
  critical_below_free_gb: 8

# Volumes to measure regardless of whether any reclaimer sits on them. The
# volume holding each resolved reclaimer root is measured anyway; this list is
# for the ones that would otherwise go unwatched.
volumes:
  - "${SystemDrive}/"

reclaimers:
  # --- host caches: other people's tools, on this machine --------------------

  - name: nvidia-ota-artifacts
    title: NVIDIA app downloaded driver artifacts
    kind: directory_contents
    safety: refetched
    owner: NVIDIA app
    roots:
      - "${ProgramData}/NVIDIA Corporation/NVIDIA app/UpdateFramework/ota-artifacts"
    why: >
      The NVIDIA app keeps every driver payload it has ever downloaded and
      never evicts them. It is the largest single reclaim on a workstation that
      has had a GPU driver for a few years, and it is pure download cache: the
      app refetches whatever it needs on the next update check.

  - name: docker-wsl-disk
    title: Docker Desktop's WSL2 data disk
    kind: command
    safety: rebuilt
    owner: Docker Desktop
    requires: docker
    measure:
      argv: [docker, system, df, --format, "{{.Reclaimable}}"]
      reads: reclaimable bytes reported by the daemon
    reclaim:
      argv: [docker, system, prune, --all, --volumes, --force]
    note: >
      Pruning frees space inside the VHDX; it does not shrink the VHDX itself,
      which only ever grows. The file is named here so a reader who has just
      pruned and seen no change on the host knows why. Compacting it is a
      separate, offline operation and is deliberately not automated -- it
      requires Docker stopped and can corrupt a running VM.
    paths_for_reference:
      - "${LOCALAPPDATA}/Docker/wsl/disk/docker_data.vhdx"

  - name: playwright-browsers
    title: Playwright browser binaries
    kind: directory_contents
    safety: rebuilt
    owner: Playwright
    roots:
      - "${LOCALAPPDATA}/ms-playwright"
    why: >
      Every browser build Playwright has been asked for, kept forever, one
      directory per version. Restored by `playwright install` or by the next
      test run that needs one.

  - name: cypress-binaries
    title: Cypress binary cache
    kind: directory_contents
    safety: rebuilt
    owner: Cypress
    roots:
      - "${LOCALAPPDATA}/Cypress/Cache"

  - name: uv-cache
    title: uv's package cache
    kind: command
    safety: refetched
    owner: uv
    requires: uv
    measure:
      argv: [uv, cache, dir]
      reads: the cache directory, then walks it
      measures_path_from_output: true
    reclaim:
      argv: [uv, cache, clean]
    note: >
      Cleaned through uv rather than by deleting the directory: uv keeps
      hardlinks from project environments into this cache, and removing the
      files underneath a live `.venv` leaves the environment importing nothing.

  - name: gradle-cache
    title: Gradle's dependency and build cache
    kind: directory_contents
    safety: refetched
    owner: Gradle
    roots:
      - "${USERPROFILE}/.gradle/caches"

  - name: maven-repository
    title: The local Maven repository
    kind: directory_contents
    safety: refetched
    owner: Maven
    roots:
      - "${USERPROFILE}/.m2/repository"

  - name: pip-cache
    title: pip's wheel and HTTP cache
    kind: directory_contents
    safety: refetched
    owner: pip
    roots:
      - "${LOCALAPPDATA}/pip/Cache"

  - name: user-temp
    title: The user temp directory
    kind: directory_contents
    safety: refetched
    owner: the operating system
    retain_days: 7
    roots:
      - "${TEMP}"
    why: >
      Held for a week rather than emptied. A running installer, a live test
      harness and this org's own scratch directories all live here, and a temp
      sweep that deletes a file being written is the one cleanup that breaks
      something that was working.

  # --- this stack's own working directories ---------------------------------
  #
  # Measured across the search roots passed to the tools, so they follow the
  # clones wherever they are rather than naming one person's layout. A pattern
  # never descends into a directory it has already matched, so one `node_modules`
  # inside another is counted once.

  - name: python-bytecode
    title: __pycache__ across the stack
    kind: glob
    within: search_roots
    safety: rebuilt
    owner: this stack
    patterns:
      - "**/__pycache__"
      - "**/.pytest_cache"
      - "**/.ruff_cache"
      - "**/.mypy_cache"

  - name: node-modules
    title: node_modules across the stack
    kind: glob
    within: search_roots
    safety: rebuilt
    owner: this stack
    patterns:
      - "**/node_modules"
    why: >
      Restored by `npm ci` or `yarn install` in the project that lost it. Worth
      listing separately from the other build output because it is usually the
      largest of them and the slowest to restore -- reclaiming it on a machine
      with no network is a mistake that is not obvious until the next install.

  - name: python-environments
    title: Virtual environments across the stack
    kind: glob
    within: search_roots
    safety: rebuilt
    owner: this stack
    patterns:
      - "**/.venv"
    why: >
      Restored by `uv sync` in the project that lost it. Listed apart from
      node_modules because the projects here are mostly Python and losing every
      environment at once means a sync in each before anything runs again.

  - name: test-and-coverage-output
    title: Test, coverage and report output
    kind: glob
    within: search_roots
    safety: rebuilt
    owner: this stack
    patterns:
      - "**/htmlcov"
      - "**/playwright-report"
      - "**/test-results"
      - "**/.coverage"
    why: >
      Regenerated by the run that produced them. Kept in the policy rather than
      left to each project's own cleanup because they accumulate per run and
      nothing here evicts them.

  # --- destructive: nothing below this line comes back ----------------------

  - name: recycle-bin
    title: The recycle bin
    kind: command
    safety: destructive
    owner: the operating system
    requires: powershell
    measure:
      argv: [powershell, -NoProfile, -Command, "(Get-ChildItem 'C:/$Recycle.Bin' -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum"]
      reads: total bytes held
    reclaim:
      argv: [powershell, -NoProfile, -Command, "Clear-RecycleBin -Force -ErrorAction SilentlyContinue"]
    why: >
      Destructive by definition: the recycle bin is the undo, and emptying it is
      the act of giving up the undo. It is in the policy so that its size is
      *reported* -- it is routinely several gigabytes and invisible -- not so
      that it is routinely emptied.
