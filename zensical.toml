[project]
site_url = "https://quaternionmedia.github.io/qm/"
site_name = "QM Governance"
site_description = "Governance documentation for Quaternion Media"
site_author = "Quaternion Media, LLC"

copyright = "Copyright &copy; 2026 Quaternion Media, LLC"

repo_url = "https://github.com/quaternionmedia/qm"
repo_name = "quaternionmedia/qm"
edit_uri = "edit/main/docs/"

nav = [
    "index.md",
    { "Families" = [
        "families/index.md",
        "families/performing.md",
        "families/instruments.md",
        "families/performer-display.md",
        "families/show-control.md",
        "families/civic.md",
        "families/core.md",
        "families/games.md",
        "families/infra.md",
        "families/irl.md",
    ] },
    { "Projects" = "projects/index.md" },
    { "About" = [
        "about/index.md",
        "about/overview.md",
        "about/architecture.md",
        "about/history.md",
    ] },
    { "Usage" = [
        "usage/index.md",
        "usage/getting-started.md",
        "usage/questions-a-new-developer-asks.md",
        "usage/first-project.md",
        "usage/next-steps.md",
        "usage/draft-a-record.md",
        "usage/add-a-perspective.md",
        "usage/propagate-a-change.md",
        "usage/read-status-documents.md",
        "usage/run-ci-locally.md",
        "usage/build-these-docs.md",
    ] },
    { "Reference" = [
        "ref/index.md",
        "ref/repo-layout.md",
        "ref/namespaces.md",
        "ref/precedence.md",
        "ref/ratification.md",
        "ref/handbook.md",
        "ref/glossary.md",
        { "Tooling" = [
            "ref/ci/index.md",
            "ref/ci/gates-and-checks.md",
            "ref/ci/status-documents.md",
            "ref/ci/registries.md",
            "ref/ci/measuring-the-suite.md",
            "ref/ci/docs-tooling.md",
            "ref/ci/demos.md",
        ] },
    ] },
]

# The palette, written from ci/palette.py, then the site's look on it, then
# the glossary link treatment. The colours are measured rather than chosen --
# ci/tests/test_palette.py and ci/tests/test_glossary_contrast.py hold the
# ratios.
extra_css = ["stylesheets/palette.css", "stylesheets/qm.css", "stylesheets/glossary.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# The site serves its own fonts (docs/stylesheets/qm.css, docs/assets/fonts/)
# and loads none from a font service.
font = false


[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/quaternionmedia/qm"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
[project.markdown_extensions.pymdownx]

arithmatex = { generic = true }
betterem = {}
caret = {}
details = {}
emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
inlinehilite = {}
keys = {}
magiclink = {}
mark = {}
smartsymbols = {}
# snippets takes base_path = "includes" when there is an includes/ directory.
snippets = {}
superfences = { custom_fences = [ { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" } ] }
tabbed = { alternate_style = true, combine_header_slug = true }
tasklist = { custom_checkbox = true }
tilde = {}

[project.markdown_extensions.zensical.extensions.preview]
configurations = [
    { targets.include = [
        "customization.md",
        "setup/extensions/*",
    ] },
]
