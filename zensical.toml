[project]
site_url = "https://quaternionmedia.github.io/qm/"
site_name = "QM Governance"
site_description = "Governance documentation for Quaternion Media"
site_author = "Quaternion Media, LLC"

copyright = "Copyright &copy; 2026 Quaternion Media, LLC"

repo_url = "https://github.com/quaternionmedia/qm"
repo_name = "quaternionmedia/qm"
edit_uri = "edit/main/docs/"

nav = [
    "index.md",
    { "About" = [
        "about/index.md",
        "about/overview.md",
        "about/architecture.md",
        "about/history.md",
    ] },
    { "Usage" = [
        "usage/index.md",
        "usage/getting-started.md",
        "usage/first-project.md",
        "usage/next-steps.md",
    ] },
    { "Cookbook" = [
        "cookbook/index.md",
        "cookbook/draft-a-record.md",
        "cookbook/add-a-perspective.md",
        "cookbook/propagate-a-change.md",
        "cookbook/read-status-documents.md",
        "cookbook/run-ci-locally.md",
        "cookbook/build-these-docs.md",
    ] },
    { "Reference" = [
        "ref/index.md",
        "ref/repo-layout.md",
        "ref/namespaces.md",
        "ref/precedence.md",
        "ref/ratification.md",
        "ref/handbook.md",
        "ref/glossary.md",
    ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"


[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/quaternionmedia/qm"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
[project.markdown_extensions.pymdownx]

arithmatex = {
  generic = true
}
betterem = {}
caret = {}
details = {}
emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
inlinehilite = {}
keys = {}
magiclink = {}
mark = {}
smartsymbols = {}
snippets = {
#   base_path = "includes",
}
superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
tasklist = {
  custom_checkbox = true
}
tilde = {}

[project.markdown_extensions.zensical.extensions.preview]
configurations = [
    { targets.include = [
        "customization.md",
        "setup/extensions/*",
    ] },
]
