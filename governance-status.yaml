undefined:
  - term: adopted
    why_not_computed: "The corpus states only what adoption is not -- 'Being pinned is not being adopted, and nothing reports the difference' -- and warns against filename checks. No record or handbook page gives a file set, a ref, or a predicate. So the artifacts each repository carries are listed and no boolean is derived from them."
    would_be_settled_by: "a record defining the adoption predicate"
  - term: current
    why_not_computed: "handbook/propagation-runbook.md names 'a dispute about whether a project is current' as the thing that would force its own promotion to a record. behind_corpus is a count with no threshold attached, so no branch is labelled current or stale here."
    would_be_settled_by: "a record attaching a state to a commit distance"
  - term: "seed drift reference"
    why_not_computed: "Nothing states whether a copied seed file is measured against the corpus tip or against the branch's own merge-base, and the two disagree on almost every branch. Both are reported; neither is the answer."
    would_be_settled_by: "one sentence in the propagation runbook"
  - term: "propagate/* and fix/* namespaces"
    why_not_computed: "handbook/propagation-runbook.md instructs creating propagate/<name>-<date> branches and eight are pushed, while README.md's namespace table has four entries and says a branch outside them 'is a mistake rather than a variation'. Namespace conformance cannot be computed against a model that contradicts the procedure."
    would_be_settled_by: "adding the namespace to README.md's table, or the runbook using an existing one"
  - term: "project repository URL"
    why_not_computed: "There is no index mapping project/<name> to a repository; handbook/propagation-runbook.md says so outright. This generator assumes <org>/<name> and reports unknown -- never unadopted -- when that repository cannot be read."
    would_be_settled_by: "a register mapping branches to repositories"
